[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderwarp"
version = "0.1.0"
description = "Fault-tolerant CSS quantum circuit optimization with ZX diagrams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "networkx",
    "matplotlib",
    "pyzx>=0.10.6",
    "stim>=1.15",
    "stimcirq",
    "cirq-core",
    "ply",
    "tqdm",
]

[project.optional-dependencies]
notebooks = ["ipykernel", "jupyterlab"]
test = ["pytest"]
mqt = ["mqt.qecc"]
guppy = ["guppylang>=0.21.6,<1.2"]
native = [
    "guppylang==0.21.16",
    "hugr==0.16.0",
    "selene-sim==0.2.18",
    "selene-hugr-qis-compiler==0.2.11",
]

[tool.setuptools.packages.find]
include = ["spiderwarp", "spiderwarp.*"]
namespaces = false

[tool.setuptools.package-data]
spiderwarp = ["assets/**/*.json", "assets/**/*.stim", "assets/**/*.qasm", "assets/**/*.md", "_se_guppy_template.py.in", "_se_adaptive_guppy_template.py.in"]
