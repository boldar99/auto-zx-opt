[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spiderwarp"
version = "0.1.0"
description = "Fault-tolerant CSS quantum circuit optimization with ZX diagrams."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "networkx",
    "matplotlib",
    "pyzx>=0.10.6",
    "stim>=1.15",
    "stimcirq",
    "cirq-core",
    "ply",
]

[project.optional-dependencies]
notebooks = ["ipykernel", "jupyterlab"]
test = ["pytest"]
mqt = ["mqt.qecc"]

[tool.setuptools.packages.find]
include = ["spiderwarp", "spiderwarp.*"]
namespaces = false

[tool.setuptools.package-data]
spiderwarp = ["assets/**/*.json", "assets/**/*.stim", "assets/**/*.qasm", "assets/**/*.md"]
